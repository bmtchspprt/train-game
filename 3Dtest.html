<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinMaster Academy | 3DLevelScanner Training</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .quiz-container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .scenario-box { background: #eef2f3; padding: 25px; border-radius: 8px; border-left: 5px solid var(--primary); margin-bottom: 25px; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 6px; background: white; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover { border-color: var(--primary); background: #f0f7ff; }
        .feedback-area { margin-top: 30px; padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .correct-btn { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .correct-btn:hover { background: #5a6268; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2 id="module-title">BinMaster Technical Certification</h2>
        <span id="score-display">Strikes: 0/3</span>
    </div>

    <div class="progress-bar"><div id="progress-fill"></div></div>

    <div id="quiz-ui">
        <div class="scenario-box">
            <h3 id="scenario-text">Loading Scenario...</h3>
        </div>
        <div id="options-list"></div>
        
        <div class="feedback-area">
            <span>Module: <strong id="module-id-display">3D-101</strong></span>
            <button class="correct-btn" onclick="openCorrectionBox()">Flag for Knowledge Correction</button>
        </div>
    </div>

    <div id="result-ui" class="hidden">
        <h1>Quiz Complete</h1>
        <p id="final-stats"></p>
        <button class="option-btn" style="text-align:center; background: var(--primary); color:white;" onclick="location.reload()">Restart Training</button>
    </div>
</div>

<script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'REPLACE_WITH_YOUR_PROJECT_URL';
    const SUPABASE_KEY = 'REPLACE_WITH_YOUR_ANON_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- TRAINING DATA (Derived from Manuals) ---
    const quizData = {
        "3D-101": {
            title: "Installation & Physical Positioning",
            scenarios: [
                {
                    text: "You are installing a 3DLevelScanner in a silo that is 10m in diameter. Where is the best mounting location?",
                    options: [
                        "Exactly in the center for maximum coverage",
                        "Between the center and the wall, using the 3DScanner Locator software ",
                        "Directly against the wall to avoid filling points "
                    ],
                    correct: 1,
                    knowledgeRef: "Manual Section 3.1: Location and positioning guidelines "
                },
                {
                    text: "What is the minimum distance required from the vessel wall for mounting?",
                    options: ["250mm", "500mm (16\") ", "1000mm"],
                    correct: 1,
                    knowledgeRef: "Manual Section 3.1: Installation Constraints "
                },
                {
                    text: "The scanner has a 'Dead Zone' where it cannot measure. What is this distance?",
                    options: ["100mm", "300mm", "500mm (16\") "],
                    correct: 2,
                    knowledgeRef: "Manual Page 10: Technical Specifications "
                }
            ]
        }
    };

    // --- APP STATE ---
    let currentModule = "3D-101";
    let currentIdx = 0;
    let strikes = 0;
    let technicianName = "Dave Zelnio"; // Default for development

    function loadScenario() {
        const module = quizData[currentModule];
        const scenario = module.scenarios[currentIdx];
        
        document.getElementById('module-id-display').innerText = currentModule;
        document.getElementById('module-title').innerText = module.title;
        document.getElementById('scenario-text').innerText = scenario.text;
        
        const list = document.getElementById('options-list');
        list.innerHTML = '';
        scenario.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            list.appendChild(btn);
        });

        const progress = ((currentIdx) / module.scenarios.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
    }

    async function checkAnswer(choice) {
        const scenario = quizData[currentModule].scenarios[currentIdx];
        
        if (choice === scenario.correct) {
            alert("Correct! " + scenario.knowledgeRef);
            currentIdx++;
        } else {
            strikes++;
            document.getElementById('score-display').innerText = `Strikes: ${strikes}/3`;
            alert("Incorrect. Review the knowledge base: " + scenario.knowledgeRef);
            if (strikes >= 3) return endQuiz(false);
            currentIdx++;
        }

        if (currentIdx >= quizData[currentModule].scenarios.length) {
            endQuiz(true);
        } else {
            loadScenario();
        }
    }

    function openCorrectionBox() {
        const comment = prompt("Correction: Please describe why this scenario or answer is technically inaccurate based on field experience:");
        if (comment) submitCorrection(comment);
    }

    async function submitCorrection(comment) {
        const scenario = quizData[currentModule].scenarios[currentIdx];
     const { error } = await _supabase.from('bst_field_feedback').insert([{
    module_ref: currentModule,
    original_scenario: scenario.text,
    author_name: technicianName,
    suggested_correction: comment
        }]);

        if (!error) alert("Knowledge correction submitted for review. Thank you.");
    }

    async function endQuiz(passed) {
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-ui').classList.remove('hidden');
        
        const status = passed ? "PASS" : "RETAKE";
        document.getElementById('final-stats').innerText = `Result: ${status} | Strikes: ${strikes}`;

        // Log to Supabase
        await _supabase.from('training_logs').insert([{
            employee_name: technicianName,
            module_id: currentModule,
            strikes: strikes,
            status: status
        }]);
    }

    // Initialize
    loadScenario();
</script>
</body>
</html>
