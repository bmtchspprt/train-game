<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Training Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; padding: 20px; }
        .game-container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 12px; border-top: 8px solid #0056b3; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .stats-box { text-align: right; font-size: 0.9rem; }
        .stat-line { margin: 4px 0; }
        .pct { font-weight: bold; color: #0056b3; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 25px; }
        #progress-fill { height: 100%; background: #28a745; width: 0%; transition: 0.4s; }
        .scenario-box { background: #fffcf0; border-left: 5px solid #f1c40f; padding: 20px; margin-bottom: 20px; font-weight: 500; }
        .choice-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: white; transition: 0.2s; }
        .choice-btn:hover { background: #f8fbff; border-color: #0056b3; }
        .feedback { padding: 15px; border-radius: 8px; margin-top: 20px; display: none; font-weight: bold; }
        .manual-cite { display: block; margin-top: 10px; font-size: 0.8rem; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div>
            <h2 id="quiz-title">Loading Quiz...</h2>
            <div>Scenario <span id="current-count">1</span> of 10</div>
        </div>
        <div class="stats-box">
            <div class="stat-line">Diagnostic Accuracy: <span id="q-score" class="pct">0</span>%</div>
            <div class="stat-line">Solution Accuracy: <span id="s-score" class="pct">0</span>%</div>
        </div>
    </div>

    <div class="progress-bar"><div id="progress-fill"></div></div>

    <div id="quiz-content">
        <h4 id="step-label">Step 1: The Scenario</h4>
        <div id="scenario-text" class="scenario-box"></div>
        <div id="choice-area"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" style="display:none; margin-top:20px; padding:12px 30px; background:#0056b3; color:white; border:none; border-radius:6px; cursor:pointer;">Next Step</button>
    </div>
</div>

<script>
// Data structure containing all 40 scenarios (10 per quiz)
const quizData = {
    "1": {
        title: "Sensor Hardware I: Installation & Physics",
        scenarios: [
            {
                text: "A customer wants to mount the scanner in the exact center of a 30ft diameter silo with a center fill.",
                questions: [
                    { t: "Is the fill stream hitting the center point directly?", c: true },
                    { t: "What is the silos serial number?", c: false },
                    { t: "Is the silo painted white?", c: false },
                    { t: "Is there a ladder on the outside?", c: false },
                    { t: "What is the material's bulk density?", c: false }
                ],
                solutions: [
                    { t: "Move the mounting point at least 1/3 of the radius away from the center/fill stream.", c: true },
                    { t: "Increase pulse power to cut through the dust.", c: false },
                    { t: "Center mounting is the preferred method; proceed.", c: false },
                    { t: "Use a smaller antenna.", c: false },
                    { t: "Install a sunshield.", c: false }
                ],
                ref: "3D Manual Section 3.1"
            },
            // ... (9 more scenarios for Quiz 1)
        ]
    },
    "2": {
        title: "Sensor Hardware II: Wiring & Comms",
        scenarios: [
            {
                text: "The scanner powers up but the MultiVision software keeps timing out when trying to read the unit.",
                questions: [
                    { t: "Is the RS485 A/B polarity reversed at the terminal block?", c: true },
                    { t: "How many pixels is the computer monitor?", c: false },
                    { t: "Is the scanner's horn pointed down?", c: false },
                    { t: "Is the technician using a laptop or desktop?", c: false },
                    { t: "Does the silo have a roof?", c: false }
                ],
                solutions: [
                    { t: "Check the RS485 wiring polarity and ensure the shield is grounded at one end.", c: true },
                    { t: "Change the Windows desktop resolution.", c: false },
                    { t: "Reset the scanner's internal clock.", c: false },
                    { t: "Replace the 24V power supply.", c: false },
                    { t: "Add more material to the bin to increase signal strength.", c: false }
                ],
                ref: "3D Manual Section 3.5"
            }
        ]
    },
    "3": {
        title: "Software I: Setup & Connection",
        scenarios: [
            {
                text: "Software is installed but the user cannot see any bins. They are using a USB-to-RS485 converter.",
                questions: [
                    { t: "Which COM Port is assigned to the converter in Windows Device Manager?", c: true },
                    { t: "Is the USB cable blue or black?", c: false },
                    { t: "How much RAM does the PC have?", c: false },
                    { t: "Is the client using a wireless mouse?", c: false },
                    { t: "Has the software been updated today?", c: false }
                ],
                solutions: [
                    { t: "Update the Communication Settings in MultiVision to match the COM Port found in Device Manager.", c: true },
                    { t: "Reinstall the PC operating system.", c: false },
                    { t: "Connect the USB converter to a different port.", c: false },
                    { t: "Buy a new scanner.", c: false },
                    { t: "Type the serial number into the COM Port field.", c: false }
                ],
                ref: "MultiVision Manual Section 4.2"
            }
        ]
    },
    "4": {
        title: "Software II: Advanced Configuration",
        scenarios: [
            {
                text: "The volume reading is consistently 10% lower than the actual weight recorded by the scales.",
                questions: [
                    { t: "Is the 'Bulk Density' or 'Vessel Dimensions' accurately entered in the config?", c: true },
                    { t: "What is the name of the silo?", c: false },
                    { t: "Is the 3D visualizer showing in color?", c: false },
                    { t: "Was the license key entered correctly?", c: false },
                    { t: "Is the PC connected to the internet?", c: false }
                ],
                solutions: [
                    { t: "Recalibrate the bulk density and verify the silo's strapping table dimensions.", c: true },
                    { t: "Change the visualizer theme.", c: false },
                    { t: "Update the MAC address.", c: false },
                    { t: "Restart the 3DVision Server.", c: false },
                    { t: "Move the scanner 2 inches to the left.", c: false }
                ],
                ref: "MultiVision Manual Section 5.2"
            }
        ]
    }
};

// Placeholder filler for the rest of the 40 scenarios to ensure code runs
for(let qid in quizData){
    while(quizData[qid].scenarios.length < 10) {
        quizData[qid].scenarios.push({
            text: "Generic Technical Scenario for " + quizData[qid].title,
            questions: [{t: "Is the configuration correct?", c:true}, {t:"Distractor 1", c:false}, {t:"Distractor 2", c:false}, {t:"Distractor 3", c:false}, {t:"Distractor 4", c:false}],
            solutions: [{t: "Correct the configuration.", c:true}, {t:"Error A", c:false}, {t:"Error B", c:false}, {t:"Error C", c:false}, {t:"Error D", c:false}],
            ref: "Manual Reference Placeholder"
        });
    }
}

// Logic Engine
const urlParams = new URLSearchParams(window.location.search);
const quizId = urlParams.get('quiz') || "1";
const currentQuiz = quizData[quizId];

let scenarioIdx = 0;
let step = 1; // 1: Scenario View, 2: Question Choice, 3: Solution Choice
let qCorrect = 0;
let sCorrect = 0;
let attempts = 0;

function updateScores() {
    const qPct = attempts === 0 ? 0 : Math.round((qCorrect / attempts) * 100);
    const sPct = attempts === 0 ? 0 : Math.round((sCorrect / attempts) * 100);
    document.getElementById('q-score').innerText = qPct;
    document.getElementById('s-score').innerText = sPct;
}

function initQuiz() {
    document.getElementById('quiz-title').innerText = currentQuiz.title;
    loadStep();
}

function loadStep() {
    const scenario = currentQuiz.scenarios[scenarioIdx];
    const area = document.getElementById('choice-area');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    
    area.innerHTML = '';
    feedback.style.display = 'none';
    nextBtn.style.display = 'none';
    document.getElementById('current-count').innerText = scenarioIdx + 1;
    document.getElementById('progress-fill').style.width = (scenarioIdx / 10 * 100) + "%";

    if (step === 1) {
        document.getElementById('step-label').innerText = "Step 1: The Scenario";
        document.getElementById('scenario-text').innerText = scenario.text;
        const startBtn = document.createElement('button');
        startBtn.className = 'choice-btn';
        startBtn.innerHTML = "<strong>➜ Analyze Case & Select Follow-up Question</strong>";
        startBtn.onclick = () => { step = 2; loadStep(); };
        area.appendChild(startBtn);
    } 
    else if (step === 2) {
        document.getElementById('step-label').innerText = "Step 2: Choose the Effective Follow-up Question";
        scenario.questions.sort(() => Math.random() - 0.5).forEach(opt => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.innerText = opt.t;
            b.onclick = () => handleChoice(opt.c, "Diagnostic validated.", 3);
            area.appendChild(b);
        });
    }
    else if (step === 3) {
        document.getElementById('step-label').innerText = "Step 3: Select the Corrective Action";
        scenario.solutions.sort(() => Math.random() - 0.5).forEach(opt => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.innerText = opt.t;
            b.onclick = () => handleChoice(opt.c, "Technical fix applied.", 4);
            area.appendChild(b);
        });
        const cite = document.createElement('span');
        cite.className = 'manual-cite';
        cite.innerText = "Reference: " + scenario.ref;
        area.appendChild(cite);
    }
}

function handleChoice(isCorrect, msg, nextStep) {
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';
    
    if (isCorrect) {
        feedback.innerText = "✓ CORRECT: " + msg;
        feedback.style.background = "#d4edda";
        feedback.style.color = "#155724";
        if (step === 2) qCorrect++;
        if (step === 3) sCorrect++;
    } else {
        feedback.innerText = "✗ INCORRECT: This choice does not align with the manual or field history.";
        feedback.style.background = "#f8d7da";
        feedback.style.color = "#721c24";
    }

    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
    nextBtn.onclick = () => {
        if (nextStep === 3) {
            step = 3;
            loadStep();
        } else {
            attempts++;
            updateScores();
            scenarioIdx++;
            step = 1;
            if (scenarioIdx < 10) {
                loadStep();
            } else {
                finishQuiz();
            }
        }
    };
}

function finishQuiz() {
    const qPct = Math.round((qCorrect / 10) * 100);
    const sPct = Math.round((sCorrect / 10) * 100);
    document.getElementById('quiz-content').innerHTML = `
        <div style="text-align:center; padding:30px;">
            <h3>Module Complete</h3>
            <p>Diagnostic Accuracy: <strong>${qPct}%</strong></p>
            <p>Solution Accuracy: <strong>${sPct}%</strong></p>
            <div style="background:#f9f9f9; padding:15px; border-radius:8px; margin:20px 0; font-size:0.9rem;">
                <strong>Grading:</strong> A passing grade requires 80% in both categories. <br>
                If your Diagnostic score is low, focus on the "Theory of Operation" sections.<br>
                If your Solution score is low, review the "Troubleshooting" appendices.
            </div>
            <button onclick="window.location.href='index.html'" class="choice-btn" style="text-align:center;">Return to Dashboard</button>
        </div>
    `;
}

initQuiz();
</script>
</body>
</html>
