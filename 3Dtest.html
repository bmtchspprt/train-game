<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Training Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .card { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .opt { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; text-align: left; background: white; }
        .opt:hover { background: #f0f7ff; border-color: #0056b3; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card" id="quiz-ui">
        <h3 id="q-text">Connecting to Supabase...</h3>
        <div id="options"></div>
        <button onclick="flag()" style="margin-top:20px; color:grey; border:none; background:none; cursor:pointer;">Flag Correction</button>
    </div>
    <div class="card hidden" id="result-ui">
        <h2>Results</h2>
        <p id="stats"></p>
        <a href="index.html">Back to Menu</a>
    </div>

    <script>
        // --- PASTE YOUR SECRETS HERE ---
        const SB_URL = 'YOUR_SUPABASE_URL_HERE';
        const SB_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        const data = [
            { q: "Dead zone distance for 3DLevelScanner?", a: ["100mm", "300mm", "500mm (16\")"], c: 2 },
            { q: "Minimum wall distance for mounting?", a: ["250mm", "500mm (16\")", "1000mm"], c: 1 }
        ];

        let idx = 0, strikes = 0;

        function load() {
            const current = data[idx];
            document.getElementById('q-text').innerText = current.q;
            const container = document.getElementById('options');
            container.innerHTML = '';
            current.a.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'opt';
                b.innerText = opt;
                b.onclick = () => {
                    if (i !== current.c) strikes++;
                    idx++;
                    if (idx >= data.length) end(); else load();
                };
                container.appendChild(b);
            });
        }

        async function end() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('result-ui').classList.remove('hidden');
            const outcome = strikes < 2 ? "PASS" : "RETAKE";
            document.getElementById('stats').innerText = `Strikes: ${strikes} | Outcome: ${outcome}`;
            await _supabase.from('bst_training_results').insert([{
                technician_name: localStorage.getItem('emp_name'),
                module_id: "3D-101", strikes: strikes, outcome: outcome
            }]);
        }

        function flag() {
            const msg = prompt("Explain the correction:");
            if (msg) _supabase.from('bst_field_feedback').insert([{
                author_name: localStorage.getItem('emp_name'),
                module_ref: "3D-101", suggested_correction: msg
            }]);
        }
        load();
    </script>
</body>
</html>
