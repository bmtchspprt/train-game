<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Session — TechTrain</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --surface2: #161625;
    --surface3: #1e1e30;
    --accent: #00e5a0;
    --accent2: #7b5cfa;
    --text: #eeeef8;
    --muted: #606080;
    --border: rgba(255,255,255,0.07);
    --correct: #00e5a0;
    --wrong: #ff4d6d;
    --warning: #ffb347;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(123,92,250,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(123,92,250,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(123,92,250,0.15) 0%, transparent 60%), radial-gradient(ellipse 40% 40% at 90% 90%, rgba(0,229,160,0.08) 0%, transparent 55%); pointer-events: none; z-index: 0; }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: rgba(8,8,16,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .user-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 100px; padding: 0.35rem 0.8rem; font-size: 0.82rem; color: var(--muted); }
  .user-chip .avatar { width: 22px; height: 22px; background: linear-gradient(135deg, var(--accent2), var(--accent)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: white; flex-shrink: 0; }
  .btn-nav { padding: 0.4rem 0.9rem; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; text-decoration: none; }
  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
  .main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; }
  .stats-bar { display: flex; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
  .stat-pill { flex: 1; min-width: 100px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.6rem; }
  .stat-icon { font-size: 1.2rem; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .session-progress { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.5rem; margin-bottom: 2rem; }
  .prog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.85rem; }
  .prog-label { color: var(--muted); }
  .prog-frac { font-family: 'Syne', sans-serif; font-weight: 700; }
  .prog-track { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.2rem; margin-bottom: 1.5rem; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  .q-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .q-tag { padding: 0.2rem 0.65rem; border-radius: 100px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid; }
  .q-tag.topic { background: rgba(123,92,250,0.1); border-color: rgba(123,92,250,0.3); color: var(--accent2); }
  .q-tag.difficulty.beginner { background: rgba(0,229,160,0.1); border-color: rgba(0,229,160,0.3); color: var(--correct); }
  .q-tag.difficulty.intermediate { background: rgba(255,179,71,0.1); border-color: rgba(255,179,71,0.3); color: var(--warning); }
  .q-tag.difficulty.advanced { background: rgba(255,77,109,0.1); border-color: rgba(255,77,109,0.3); color: var(--wrong); }
  .q-timer { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--muted); }
  .timer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .q-text { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 600; line-height: 1.5; letter-spacing: -0.01em; margin-bottom: 1.8rem; }
  .options { display: flex; flex-direction: column; gap: 0.75rem; }
  .option-btn { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.2rem; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; font-size: 0.93rem; color: var(--text); transition: all 0.2s; width: 100%; }
  .option-btn:hover:not(:disabled) { border-color: rgba(123,92,250,0.5); background: rgba(123,92,250,0.06); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--correct); background: rgba(0,229,160,0.08); }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(255,77,109,0.08); }
  .opt-letter { width: 28px; height: 28px; border-radius: 7px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; transition: background 0.2s; }
  .option-btn.correct .opt-letter { background: var(--correct); color: #0a0a0f; }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: white; }
  .opt-text { flex: 1; line-height: 1.5; padding-top: 0.1rem; }
  .explanation-box { background: var(--surface2); border: 1px solid rgba(0,229,160,0.2); border-radius: 12px; padding: 1.2rem 1.4rem; margin-top: 1.5rem; font-size: 0.88rem; line-height: 1.7; color: var(--text); display: none; animation: fadeUp 0.3s ease; }
  .explanation-box.show { display: block; }
  .explanation-box .exp-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; margin-bottom: 0.5rem; }
  .feedback-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  .btn-feedback { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; color: var(--muted); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .btn-feedback:hover { border-color: var(--warning); color: var(--warning); }
  .btn-feedback.submitted { border-color: rgba(0,229,160,0.3); color: var(--accent); cursor: default; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s; }
  .modal-backdrop.hidden { display: none; }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 480px; animation: fadeUp 0.3s ease; }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem; }
  .modal-sub { font-size: 0.83rem; color: var(--muted); margin-bottom: 1.5rem; }
  .feedback-types { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .ftype-btn { padding: 0.4rem 0.9rem; border-radius: 100px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .ftype-btn:hover, .ftype-btn.active { border-color: var(--warning); color: var(--warning); background: rgba(255,179,71,0.08); }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; resize: vertical; min-height: 100px; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent2); }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1rem; }
  .btn-cancel { padding: 0.6rem 1.2rem; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 0.88rem; }
  .btn-submit-fb { padding: 0.6rem 1.4rem; background: var(--accent2); border: none; border-radius: 8px; color: white; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
  .btn-submit-fb:hover { background: #9070ff; }
