<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Session — TechTrain</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #0f0f1a;
    --surface2: #161625;
    --surface3: #1e1e30;
    --accent: #00e5a0;
    --accent2: #7b5cfa;
    --maroon: #8B1A1A;
    --maroon-light: #c0392b;
    --maroon-glow: rgba(139,26,26,0.18);
    --text: #eeeef8;
    --muted: #606080;
    --border: rgba(255,255,255,0.07);
    --correct: #00e5a0;
    --wrong: #ff4d6d;
    --warning: #ffb347;
    --headline-font: 'Arial Narrow', Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(139,26,26,0.1) 0%, transparent 60%), radial-gradient(ellipse 40% 40% at 90% 90%, rgba(0,229,160,0.06) 0%, transparent 55%); pointer-events: none; z-index: 0; }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: rgba(8,8,16,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--headline-font); font-weight: bold; font-size: 1.4rem; color: var(--text); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; }
  .logo span { color: var(--maroon-light); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .user-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 100px; padding: 0.35rem 0.8rem; font-size: 0.82rem; color: var(--muted); }
  .user-chip .avatar { width: 22px; height: 22px; background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: white; flex-shrink: 0; }
  .btn-nav { padding: 0.4rem 0.9rem; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; text-decoration: none; font-family: var(--headline-font); font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn-nav:hover { border-color: var(--maroon-light); color: var(--maroon-light); }
  .main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; min-height: calc(100vh - 65px); }
  .page-headline { font-family: var(--headline-font); font-weight: bold; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--maroon-light); margin-bottom: 0.3rem; text-shadow: 0 0 30px var(--maroon-glow); }
  .page-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 2rem; }
  .stats-bar { display: flex; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
  .stat-pill { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; display: flex; align-items: center; gap: 0.7rem; transition: border-color 0.2s; }
  .stat-pill:hover { border-color: var(--maroon); }
  .stat-icon { font-size: 1.2rem; }
  .stat-value { font-family: var(--headline-font); font-weight: bold; font-size: 1.3rem; color: var(--text); }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .session-progress { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.5rem; margin-bottom: 2rem; }
  .prog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.85rem; }
  .prog-label { color: var(--muted); font-family: var(--headline-font); font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; }
  .prog-frac { font-family: var(--headline-font); font-weight: bold; color: var(--maroon-light); }
  .prog-track { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--maroon), var(--maroon-light)); border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .sec-label { font-family: var(--headline-font); font-weight: bold; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--maroon-light); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; text-shadow: 0 0 20px var(--maroon-glow); }
  .sec-label::after { content: ''; flex: 1; height: 1px; background: var(--maroon); opacity: 0.3; }
  .effort-banner { background: var(--maroon-glow); border: 1px solid rgba(139,26,26,0.3); border-radius: 12px; padding: 1rem 1.4rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; color: #e88080; }
  .effort-banner-icon { font-size: 1.2rem; }
  .effort-banner strong { font-family: var(--headline-font); font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; color: var(--maroon-light); }
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.2rem; margin-bottom: 1.5rem; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
  .q-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .q-tag { padding: 0.2rem 0.65rem; border-radius: 100px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid; font-family: var(--headline-font); }
  .q-tag.topic { background: var(--maroon-glow); border-color: rgba(139,26,26,0.4); color: #e88080; }
  .q-tag.difficulty.beginner { background: rgba(0,229,160,0.1); border-color: rgba(0,229,160,0.3); color: var(--correct); }
  .q-tag.difficulty.intermediate { background: rgba(255,179,71,0.1); border-color: rgba(255,179,71,0.3); color: var(--warning); }
  .q-tag.difficulty.advanced { background: rgba(255,77,109,0.1); border-color: rgba(255,77,109,0.3); color: var(--wrong); }
  .q-timer { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--muted); }
  .timer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--maroon-light); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .q-num { font-family: var(--headline-font); font-weight: bold; font-size: 0.72rem; color: var(--maroon-light); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  .q-text { font-family: var(--headline-font); font-weight: bold; font-size: 1.25rem; line-height: 1.45; letter-spacing: 0.01em; margin-bottom: 1.8rem; color: var(--text); }
  .options { display: flex; flex-direction: column; gap: 0.75rem; }
  .option-btn { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.2rem; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; font-size: 0.93rem; color: var(--text); transition: all 0.2s; width: 100%; }
  .option-btn:hover:not(:disabled) { border-color: rgba(139,26,26,0.5); background: var(--maroon-glow); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--correct); background: rgba(0,229,160,0.08); }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(255,77,109,0.08); }
  .opt-letter { width: 28px; height: 28px; border-radius: 7px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-family: var(--headline-font); font-size: 0.85rem; font-weight: bold; flex-shrink: 0; transition: background 0.2s; }
  .option-btn.correct .opt-letter { background: var(--correct); color: #0a0a0f; }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: white; }
  .opt-text { flex: 1; line-height: 1.5; padding-top: 0.1rem; }
  .explanation-box { background: var(--surface2); border: 1px solid rgba(139,26,26,0.3); border-radius: 12px; padding: 1.2rem 1.4rem; margin-top: 1.5rem; font-size: 0.88rem; line-height: 1.7; color: var(--text); display: none; animation: fadeUp 0.3s ease; }
  .explanation-box.show { display: block; }
  .explanation-box .exp-label { font-family: var(--headline-font); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--maroon-light); font-weight: bold; margin-bottom: 0.5rem; }
  .feedback-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  .btn-feedback { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; color: var(--muted); font-size: 0.82rem; cursor: pointer; transition: all 0.2s; font-family: var(--headline-font); font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn-feedback:hover { border-color: var(--warning); color: var(--warning); }
  .btn-feedback.submitted { border-color: rgba(0,229,160,0.3); color: var(--accent); cursor: default; }
  .btn-next { padding: 0.85rem 2rem; background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); border: none; border-radius: 10px; color: white; font-family: var(--headline-font); font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.08em; box-shadow: 0 4px 20px rgba(139,26,26,0.3); }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(139,26,26,0.4); }
  .results-card { background: var(--surface); border: 1px solid rgba(139,26,26,0.3); border-radius: 20px; padding: 2.5rem; text-align: center; animation: fadeUp 0.5s ease; }
  .results-headline { font-family: var(--headline-font); font-weight: bold; font-size: 2rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--maroon-light); margin-bottom: 0.5rem; text-shadow: 0 0 30px var(--maroon-glow); }
  .results-sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 2rem; }
  .results-stats { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
  .result-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.8rem; min-width: 130px; }
  .result-stat-val { font-family: var(--headline-font); font-weight: bold; font-size: 2rem; color: var(--maroon-light); margin-bottom: 0.2rem; }
  .result-stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .improvement-msg { background: var(--maroon-glow); border: 1px solid rgba(139,26,26,0.25); border-radius: 10px; padding: 1rem 1.4rem; font-size: 0.88rem; color: #e88080; margin-bottom: 1.5rem; font-style: italic; }
  .btn-restart { padding: 0.9rem 2.5rem; background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); border: none; border-radius: 10px; color: white; font-family: var(--headline-font); font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.08em; box-shadow: 0 4px 20px rgba(139,26,26,0.3); }
  .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(139,26,26,0.4); }
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
  .empty-state h2 { font-family: var(--headline-font); font-weight: bold; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--maroon-light); margin-bottom: 0.5rem; }
  .empty-state p { font-size: 0.88rem; line-height: 1.7; max-width: 400px; margin: 0 auto; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s; }
  .modal-backdrop.hidden { display: none; }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }
  .modal { background: var(--surface); border: 1px solid rgba(139,26,26,0.3); border-radius: 20px; padding: 2rem; width: 100%; max-width: 480px; animation: fadeUp 0.3s ease; }
  .modal-title { font-family: var(--headline-font); font-weight: bold; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--maroon-light); margin-bottom: 0.4rem; }
  .modal-sub { font-size: 0.83rem; color: var(--muted); margin-bottom: 1.5rem; }
  .feedback-types { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .ftype-btn { padding: 0.4rem 0.9rem; border-radius: 100px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: var(--headline-font); font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; }
  .ftype-btn:hover, .ftype-btn.active { border-color: var(--warning); color: var(--warning); background: rgba(255,179,71,0.08); }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; resize: vertical; min-height: 100px; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--maroon-light); }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1rem; }
  .btn-cancel { padding: 0.6rem 1.2rem; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 0.88rem; }
  .btn-submit-fb { padding: 0.6rem 1.4rem; background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); border: none; border-radius: 8px; color: white; font-size: 0.88rem; font-weight: 700; cursor: pointer; font-family: var(--headline-font); text-transform: uppercase; letter-spacing: 0.04em; }
  .btn-submit-fb:hover { opacity: 0.9; }
  .loading-state { text-align: center; padding: 4rem; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">TECH<span>TRAIN</span></a>
  <div class="nav-right">
    <div class="user-chip">
      <div class="avatar" id="userAvatar">T</div>
      <span id="userLabel">Technician</span>
    </div>
    <a href="dashboard.html" class="btn-nav">Dashboard</a>
    <a href="upload.html" class="btn-nav">Upload</a>
    <button class="btn-nav" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="main" id="mainContent">
  <div class="loading-state">
    <div style="font-family:'Arial Narrow',Arial,sans-serif;font-weight:bold;font-size:1.1rem;color:#c0392b;text-transform:uppercase;letter-spacing:0.1em;">Loading Training Questions...</div>
  </div>
</div>

<div class="modal-backdrop hidden" id="feedbackModal">
  <div class="modal">
    <div class="modal-title">Report an Issue</div>
    <div class="modal-sub">Help us improve the question bank by flagging problems.</div>
    <div class="feedback-types" id="ftypes">
      <button class="ftype-btn" onclick="selectFtype(this,'wrong_answer')">Wrong Answer</button>
      <button class="ftype-btn" onclick="selectFtype(this,'unclear_question')">Unclear</button>
      <button class="ftype-btn" onclick="selectFtype(this,'outdated_info')">Outdated</button>
      <button class="ftype-btn" onclick="selectFtype(this,'other')">Other</button>
    </div>
    <textarea id="fbComment" placeholder="Describe the issue (optional)..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeFeedback()">Cancel</button>
      <button class="btn-submit-fb" onclick="submitFeedback()">Submit Report</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const user = JSON.parse(localStorage.getItem('tt_user') || '{}');
  const userEmail = user.email || 'technician@techtrain.app';
  document.getElementById('userLabel').textContent = userEmail.split('@')[0];
  document.getElementById('userAvatar').textContent = (userEmail[0] || 'T').toUpperCase();

  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  let questions = [], current = 0, sessionCorrect = 0, sessionAnswered = 0;
  let sessionStartTime = Date.now(), questionStartTime = Date.now();
  let currentFeedbackQId = null, selectedFtype = null, previousBestScore = null;

  async function loadQuestions() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/bst_training_results?select=*&status=eq.active&order=random()&limit=20`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
      const data = await res.json();
      questions = Array.isArray(data) && data.length > 0 ? data : getDemoQuestions();
    } catch(e) { questions = getDemoQuestions(); }
    await loadPreviousBest();
    renderSession();
  }

  async function loadPreviousBest() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/training_logs?select=is_correct&user_email=eq.${encodeURIComponent(userEmail)}&order=created_at.desc&limit=100`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
      const logs = await res.json();
      if (Array.isArray(logs) && logs.length > 0) {
        previousBestScore = Math.round((logs.filter(l => l.is_correct).length / logs.length) * 100);
      }
    } catch(e) {}
  }

  function renderSession() {
    if (questions.length === 0) {
      document.getElementById('mainContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><h2>No Training Questions Yet</h2><p>Your admin hasn't uploaded any training material yet. Check back soon.</p></div>`;
      return;
    }
    renderStats();
  }

  function renderStats() {
    const elapsed = Math.round((Date.now() - sessionStartTime) / 60000);
    document.getElementById('mainContent').innerHTML = `
      <div class="page-headline">Training Session</div>
      <div class="page-sub">Questions drawn from your team's knowledge base</div>
      <div class="effort-banner">
        <span class="effort-banner-icon">💪</span>
        <div><strong>Keep Going</strong> — Every question you attempt builds real field knowledge. Focus on effort and learning, not the score.</div>
      </div>
      <div class="stats-bar">
        <div class="stat-pill"><span class="stat-icon">📝</span><div><div class="stat-value" id="statAnswered">${sessionAnswered}</div><div class="stat-label">Attempted</div></div></div>
        <div class="stat-pill"><span class="stat-icon">⏱</span><div><div class="stat-value" id="statTime">${elapsed}m</div><div class="stat-label">Time Spent</div></div></div>
        <div class="stat-pill"><span class="stat-icon">🔥</span><div><div class="stat-value" id="statSession">${sessionAnswered}</div><div class="stat-label">This Session</div></div></div>
      </div>
      <div class="session-progress">
        <div class="prog-header">
          <span class="prog-label">Session Progress</span>
          <span class="prog-frac" id="progFrac">${current + 1} / ${questions.length}</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:${(current/questions.length*100)}%"></div></div>
      </div>
      <div id="questionArea"></div>`;
    renderQuestionInArea();
  }

  function renderQuestionInArea() {
    if (current >= questions.length) { showResults(); return; }
    const q = questions[current];
    questionStartTime = Date.now();
    const opts = Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]');
    document.getElementById('questionArea').innerHTML = `
      <div class="sec-label">Question ${current + 1}</div>
      <div class="q-card" id="qCard">
        <div class="q-meta">
          <div class="q-tags">
            ${q.topic ? `<span class="q-tag topic">${q.topic}</span>` : ''}
            ${q.category ? `<span class="q-tag topic">${q.category}</span>` : ''}
            <span class="q-tag difficulty ${q.difficulty||'beginner'}">${q.difficulty||'beginner'}</span>
          </div>
          <div class="q-timer"><div class="timer-dot"></div><span id="timerDisplay">0s</span></div>
        </div>
        <div class="q-num">Question ${current + 1} of ${questions.length}</div>
        <div class="q-text">${q.question}</div>
        <div class="options" id="optionsArea">
          ${opts.map((opt, i) => {
            const letter = ['A','B','C','D'][i];
            return `<button class="option-btn" onclick="selectAnswer('${letter}', this)" data-letter="${letter}">
              <div class="opt-letter">${letter}</div>
              <div class="opt-text">${opt}</div>
            </button>`;
          }).join('')}
        </div>
        <div class="explanation-box" id="expBox">
          <div class="exp-label">Explanation</div>
          <div id="expText"></div>
        </div>
        <div class="feedback-row">
          <button class="btn-feedback" id="fbBtn" onclick="openFeedback('${q.id}')">⚑ Flag Issue</button>
          <button class="btn-next" id="nextBtn" style="display:none;" onclick="nextQuestion()">
            ${current < questions.length - 1 ? 'Next Question →' : 'See Results →'}
          </button>
        </div>
      </div>`;
    startTimer();
  }

  let timerInterval = null;
  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const el = document.getElementById('timerDisplay');
      if (el) el.textContent = Math.round((Date.now() - questionStartTime) / 1000) + 's';
    }, 1000);
  }

  function selectAnswer(letter, btn) {
    clearInterval(timerInterval);
    const q = questions[current];
    const timeTaken = Math.round((Date.now() - questionStartTime) / 1000);
    const correct = q.correct_answer === letter;
    if (correct) sessionCorrect++;
    sessionAnswered++;
    document.querySelectorAll('.option-btn').forEach(b => {
      b.disabled = true;
      if (b.dataset.letter === q.correct_answer) b.classList.add('correct');
      else if (b === btn && !correct) b.classList.add('wrong');
    });
    if (q.explanation) { document.getElementById('expText').textContent = q.explanation; document.getElementById('expBox').classList.add('show'); }
    document.getElementById('nextBtn').style.display = 'inline-flex';
    const sa = document.getElementById('statAnswered'); if (sa) sa.textContent = sessionAnswered;
    const ss = document.getElementById('statSession'); if (ss) ss.textContent = sessionAnswered;
    logAnswer(q, letter, correct, timeTaken);
  }

  async function logAnswer(q, letter, correct, timeTaken) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/training_logs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ user_email: userEmail, question_id: q.id, is_correct: correct, time_taken_seconds: timeTaken })
      });
    } catch(e) {}
  }

  function nextQuestion() {
    current++;
    const pf = document.getElementById('progFill'); if (pf) pf.style.width = (current/questions.length*100)+'%';
    const pfrac = document.getElementById('progFrac'); if (pfrac) pfrac.textContent = `${Math.min(current+1,questions.length)} / ${questions.length}`;
    if (current >= questions.length) { showResults(); return; }
    renderQuestionInArea();
  }

  function showResults() {
    clearInterval(timerInterval);
    const elapsed = Math.round((Date.now() - sessionStartTime) / 60000);
    const pct = sessionAnswered > 0 ? Math.round((sessionCorrect/sessionAnswered)*100) : 0;
    let msg = '';
    if (previousBestScore !== null) {
      if (pct > previousBestScore) msg = `📈 You improved ${pct - previousBestScore} points since your last session. Keep it up!`;
      else if (pct === previousBestScore) msg = `💪 Consistent performance — your knowledge is holding strong. Keep practicing!`;
      else msg = `🔄 Every session builds long-term retention. The effort you put in today matters more than any single score.`;
    } else {
      msg = `🌱 Great first session! Come back regularly — improvement comes from consistent practice over time.`;
    }
    document.getElementById('mainContent').innerHTML = `
      <div class="page-headline">Session Complete</div>
      <div class="page-sub">Here's how this session went</div>
      <div class="results-card">
        <div class="results-headline">Well Done!</div>
        <div class="results-sub">You completed ${sessionAnswered} question${sessionAnswered!==1?'s':''} in this session</div>
        <div class="results-stats">
          <div class="result-stat"><div class="result-stat-val">${sessionAnswered}</div><div class="result-stat-label">Questions Attempted</div></div>
          <div class="result-stat"><div class="result-stat-val">${elapsed}m</div><div class="result-stat-label">Time Invested</div></div>
          <div class="result-stat"><div class="result-stat-val">${sessionCorrect}</div><div class="result-stat-label">Correct Answers</div></div>
        </div>
        <div class="improvement-msg">${msg}</div>
        <button class="btn-restart" onclick="restartSession()">Train Again →</button>
      </div>`;
  }

  function restartSession() {
    current = 0; sessionCorrect = 0; sessionAnswered = 0; sessionStartTime = Date.now();
    loadQuestions();
  }

  function openFeedback(qId) {
    currentFeedbackQId = qId; selectedFtype = null;
    document.getElementById('fbComment').value = '';
    document.querySelectorAll('.ftype-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('feedbackModal').classList.remove('hidden');
  }
  function closeFeedback() { document.getElementById('feedbackModal').classList.add('hidden'); }
  function selectFtype(btn, type) {
    selectedFtype = type;
    document.querySelectorAll('.ftype-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  async function submitFeedback() {
    const q = questions[current];
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/question_feedback`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ question_id: currentFeedbackQId, question_text: q?.question||'', feedback_type: selectedFtype||'other', comment: document.getElementById('fbComment').value, author_name: userEmail, status: 'pending' })
      });
    } catch(e) {}
    closeFeedback();
    const btn = document.getElementById('fbBtn');
    if (btn) { btn.textContent = '✓ Reported'; btn.classList.add('submitted'); btn.disabled = true; }
  }

  function getDemoQuestions() {
    return [
      { id:'q1', question:'When evacuating a refrigerant system, what minimum vacuum level should be achieved?', topic:'Refrigerant Handling', difficulty:'intermediate', options:['A) 1000 microns','B) 500 microns','C) 300 microns','D) 100 microns'], correct_answer:'C', explanation:'300 microns ensures full removal of moisture and non-condensables.', status:'active' },
      { id:'q2', question:'A customer reports warm air but the compressor runs. What is the FIRST diagnostic step?', topic:'Electrical Diagnostics', difficulty:'beginner', options:['A) Replace compressor','B) Check refrigerant pressures','C) Check air filter','D) Reset thermostat'], correct_answer:'B', explanation:'Refrigerant pressures give immediate diagnostic direction.', status:'active' },
      { id:'q3', question:'Which EPA section governs refrigerant handling for stationary equipment?', topic:'Safety Procedures', difficulty:'beginner', options:['A) 406','B) 608','C) 702','D) 501'], correct_answer:'B', explanation:'Section 608 of the Clean Air Act.', status:'active' },
    ];
  }

  loadQuestions();
</script>
</body>
</html>
