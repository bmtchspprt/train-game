<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Scanner Training - 45 Scenarios</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; line-height: 1.6; padding: 20px; }
        .game-container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #0056b3; }
        .score-panel { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; }
        .progress-bar { height: 12px; background: #e9ecef; border-radius: 6px; margin: 20px 0; overflow: hidden; }
        #progress { height: 100%; background: #28a745; width: 0%; transition: 0.5s; }
        .choice-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; background: #fff; font-size: 1rem; transition: all 0.2s; }
        .choice-btn:hover { background: #f0f7ff; border-color: #0056b3; transform: translateX(5px); }
        .feedback { font-weight: bold; margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .grading-desc { font-size: 0.85rem; color: #666; margin-top: 5px; font-style: italic; }
        .manual-ref { color: #0056b3; font-size: 0.8rem; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="score-panel">
        <div><strong>Scenario:</strong> <span id="count">1</span> / 45</div>
        <div><strong>Technical Empathy:</strong> <span id="score">0</span>%
            <div class="grading-desc">Correct diagnostic questions show professional efficiency.</div>
        </div>
    </div>
    
    <div class="progress-bar"><div id="progress"></div></div>

    <div id="game-content">
        <h3 id="step-title">Step 1: The Scenario</h3>
        <p id="scenario-text" style="font-size: 1.1rem; color: #2c3e50; font-weight: 500;"></p>
        <div id="choices"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" style="display:none; margin-top:20px; padding:12px 30px; background:#0056b3; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Continue to Next Phase</button>
    </div>
</div>

<script>
const scenarios = [
    // SCENARIO 1: THAILAND EMAILS
    {
        scenario: "Field Report: All 5 MVL units in Thailand show constant temperature errors (199°F) even after a factory reset.",
        questions: [
            { text: "Do the units chirping/pulse when powered up outside the silo?", correct: true },
            { text: "Is the site using a shielded Belden #3084A cable?", correct: false },
            { text: "Has the transducer been disassembled recently?", correct: false },
            { text: "Is the RS485 converter set to COM Port 2?", correct: false },
            { text: "What is the specific ambient temperature at the top of the silo?", correct: false }
        ],
        actions: [
            { text: "Inspect transducer connectors for loose/disconnected wires.", correct: true },
            { text: "Replace the electronic card.", correct: false },
            { text: "Install a new license key.", correct: false },
            { text: "Check the PC Device Manager.", correct: false },
            { text: "Add a 120-ohm resistor to the line.", correct: false }
        ],
        ref: "Source: JES Thailand Email History (Eran Malka)"
    },

    // SCENARIO 2: PHYSICAL MANUAL - MOUNTING
    {
        scenario: "A customer wants to mount the scanner near the center of the silo to get the best average level.",
        questions: [
            { text: "Is there an internal ladder or brace within 2 feet of the center?", correct: true },
            { text: "Is the silo taller than 200 feet?", correct: false },
            { text: "Is the product stored in liquid form?", correct: false },
            { text: "What is the material's dielectric constant?", correct: false },
            { text: "Is the power supply 110V or 240V?", correct: false }
        ],
        actions: [
            { text: "Relocate the scanner; never mount in the center due to excessive noise/reflections.", correct: true },
            { text: "Proceed with center mounting.", correct: false },
            { text: "Use a longer horn assembly.", correct: false },
            { text: "Calibrate for center-loading only.", correct: false },
            { text: "Apply a noise filter in 3DMultiVision.", correct: false }
        ],
        ref: "Source: 3D Manual Section 3.1 (Location Guidelines)"
    },

    // SCENARIO 3: SOFTWARE MANUAL - LICENSING
    {
        scenario: "The client successfully installed 3DMultiVision, but after 31 days, they can no longer see bin data.",
        questions: [
            { text: "Was a permanent license key entered before the 30-day trial expired?", correct: true },
            { text: "Is the server computer connected to the internet?", correct: false },
            { text: "Did the technician change the server password?", correct: false },
            { text: "Is the MAC address of the client PC correct?", correct: false },
            { text: "Was the project exported from a previous version?", correct: false }
        ],
        actions: [
            { text: "Obtain the 3DVision Server MAC address and request a license key.", correct: true },
            { text: "Reinstall the software to reset the trial.", correct: false },
            { text: "Change the server port to 22222.", correct: false },
            { text: "Clear the browser cache.", correct: false },
            { text: "Check if the USB-RS485 driver is signed.", correct: false }
        ],
        ref: "Source: 3D MultiVision Manual (Licensing Section)"
    },

    // SCENARIO 4: MANUAL - WIRING DISTANCE
    {
        scenario: "A technician is planning an RS485 run that spans 5,000 feet (1500m) from the silo to the PC.",
        questions: [
            { text: "What is the total cable length for the RS485 loop?", correct: true },
            { text: "Is the cable UV-rated?", correct: false },
            { text: "Are you using 4-20mA as a backup?", correct: false },
            { text: "How many silos are on this run?", correct: false },
            { text: "Is the conduit made of PVC or Steel?", correct: false }
        ],
        actions: [
            { text: "Advise the client that RS485 max distance is 4000ft; they need a repeater or wireless bridge.", correct: true },
            { text: "Use thicker 12AWG wire to bridge the gap.", correct: false },
            { text: "Decrease the baud rate to 1200.", correct: false },
            { text: "Swap to a 2nd COM port.", correct: false },
            { text: "Connect only one scanner per loop.", correct: false }
        ],
        ref: "Source: 3D Manual Section 3.5 (Wiring Specifications)"
    },

    // SCENARIO 5: EMAIL - RS485 COLLAPSE
    {
        scenario: "After a thunderstorm, the entire RS485 daisy chain is unresponsive, but the PC is fine.",
        questions: [
            { text: "Does removing one specific scanner from the chain restore communication to others?", correct: true },
            { text: "Is the software displaying 'Project Not Found'?", correct: false },
            { text: "Was the PC unplugged during the storm?", correct: false },
            { text: "Are the scanners making a high-pitched whine?", correct: false },
            { text: "Is the site using Windows 7 or Windows 10?", correct: false }
        ],
        actions: [
            { text: "Check for a surge-damaged RS485 chip in one unit pulling down the entire bus.", correct: true },
            { text: "Replace the USB-RS485 adapter at the PC.", correct: false },
            { text: "Re-calibrate the Z-position of all sensors.", correct: false },
            { text: "Disable the firewall on the server.", correct: false },
            { text: "Perform a factory reset on the server software.", correct: false }
        ],
        ref: "Source: BinMaster Support Case Log (Tyler Strop)"
    }
];

// GENERATING 40 PLACEHOLDERS FOR FULL 45-QUEST LIST
for(let i=5; i<45; i++) {
    scenarios.push({
        scenario: `Expansion Scenario #${i+1}: Sourced from Manual Chapter ${Math.floor(i/5)}.`,
        questions: [
            {text: "Correct diagnostic question based on manual?", correct: true},
            {text: "Distractor A", correct: false}, {text: "Distractor B", correct: false},
            {text: "Distractor C", correct: false}, {text: "Distractor D", correct: false}
        ],
        actions: [
            {text: "Correct technical correction", correct: true},
            {text: "Incorrect action A", correct: false}, {text: "Incorrect action B", correct: false},
            {text: "Incorrect action C", correct: false}, {text: "Incorrect action D", correct: false}
        ],
        ref: "Source: BinMaster Documentation"
    });
}

let currentIdx = 0;
let currentStep = 1; 
let score = 0;

function loadStep() {
    const item = scenarios[currentIdx];
    const choicesDiv = document.getElementById('choices');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    
    choicesDiv.innerHTML = '';
    feedback.style.display = 'none';
    nextBtn.style.display = 'none';
    document.getElementById('count').innerText = currentIdx + 1;

    if (currentStep === 1) {
        document.getElementById('step-title').innerText = "Step 1: The Scenario";
        document.getElementById('scenario-text').innerText = item.scenario;
        const btn = document.createElement('button');
