<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Scanner Troubleshooting Test</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; line-height: 1.6; padding: 20px; }
        .game-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .progress-bar { height: 10px; background: #ddd; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #progress { height: 100%; background: #28a745; width: 0%; transition: 0.3s; }
        .step { display: none; }
        .step.active { display: block; }
        .choice-btn { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; background: #fff; transition: 0.2s; }
        .choice-btn:hover { background: #f0f7ff; border-color: #0056b3; }
        .feedback { font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .score-display { float: right; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="score-display">Empathy Score: <span id="score">0</span>%</div>
    <h2>3D Scanner Field Training</h2>
    <div class="progress-bar"><div id="progress"></div></div>

    <div id="game-content">
        <h3 id="step-title">Step 1: The Scenario</h3>
        <p id="scenario-text"></p>
        <div id="choices"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" style="display:none; margin-top:20px; padding:10px 20px; background:#0056b3; color:white; border:none; border-radius:5px; cursor:pointer;">Continue</button>
    </div>
</div>

<script>
const scenarios = [
    {
        scenario: "Thailand site reports MVL units showing 199°F or negative values instantly after installation.",
        step2_questions: [
            { text: "Are the scanners in a high-vibration environment?", correct: false },
            { text: "Is the temperature fluctuation constant and does it happen outside the silo?", correct: true },
            { text: "What color is the extension cable?", correct: false }
        ],
        step3_actions: [
            { text: "Replace the entire electronic card.", correct: false },
            { text: "Check for a loose wire at the transducer connector/antenna.", correct: true },
            { text: "Install a cooling jacket.", correct: false }
        ],
        relevance: "Based on Jesinno Thailand troubleshooting emails."
    },
    {
        scenario: "A Swiss customer reports that after adding two scanners, the whole RS485 chain died.",
        step2_questions: [
            { text: "Does the system work if you disconnect the two new units?", correct: true },
            { text: "Are the scanners mounted at exactly 0 degrees?", correct: false },
            { text: "Is the server computer running Windows 10?", correct: false }
        ],
        step3_actions: [
            { text: "Add a 120-ohm termination resistor.", correct: false },
            { text: "Individual bench test: check power with the horn assembly unplugged.", correct: true },
            { text: "Reinstall the USB drivers.", correct: false }
        ],
        relevance: "Based on Tyler Strop's advice to Juracement."
    },
    {
        scenario: "A customer is confused about wiring the High Temp (HT) scanner extensions.",
        step2_questions: [
            { text: "Are these standard field-swappable cables?", correct: true },
            { text: "How long is the total run?", correct: false }
        ],
        step3_actions: [
            { text: "The scanners must be returned as cables are hardwired at the transducer.", correct: true },
            { text: "Tell them to solder the extension in the field.", correct: false }
        ]
    }
    // ... Additional 42 scenarios would follow this pattern following the logic:
    // Scenarios 4-10: Installation (Mounting, Clearances from Manual)
    // Scenarios 11-20: Wiring & Power (Daisy chains, Belden 3084A, Grounding)
    // Scenarios 21-30: Software (COM ports, MAC address, Server port 22222)
    // Scenarios 31-40: Transducer/Antenna (Chirping sounds, cleaning, dust)
    // Scenarios 41-45: Advanced (Multivision licensing, 30-day trial)
];

// Filling out more scenario data for the script to work...
for(let i=3; i<45; i++) {
    scenarios.push({
        scenario: `System Challenge #${i+1}: Technical detail from Manual/Email...`,
        step2_questions: [{text: "Is the wiring to spec?", correct: true}, {text: "Is it raining?", correct: false}],
        step3_actions: [{text: "Correct technical fix", correct: true}, {text: "Incorrect fix", correct: false}]
    });
}

let currentIdx = 0;
let currentStep = 1; // 1: Scenario, 2: Followup, 3: Action
let score = 0;

function loadStep() {
    const item = scenarios[currentIdx];
    const choicesDiv = document.getElementById('choices');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    choicesDiv.innerHTML = '';
    feedback.style.display = 'none';
    nextBtn.style.display = 'none';

    if (currentStep === 1) {
        document.getElementById('step-title').innerText = "Step 1: The Scenario";
        document.getElementById('scenario-text').innerText = item.scenario;
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = "Analyze Scenario & Ask Questions";
        btn.onclick = () => { currentStep = 2; loadStep(); };
        choicesDiv.appendChild(btn);
    } 
    else if (currentStep === 2) {
        document.getElementById('step-title').innerText = "Step 2: Effective Follow-up Questions";
        item.step2_questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = q.text;
            btn.onclick = () => handleChoice(q.correct, "Question validated. Proceeding to Corrective Action.");
            choicesDiv.appendChild(btn);
        });
    }
    else if (currentStep === 3) {
        document.getElementById('step-title').innerText = "Step 3: Corrective Action";
        item.step3_actions.forEach(a => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = a.text;
            btn.onclick = () => handleChoice(a.correct, "Action logged. Moving to next scenario.");
            choicesDiv.appendChild(btn);
        });
    }
}

function handleChoice(isCorrect, msg) {
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';
    if (isCorrect) {
        feedback.innerText = "✓ Correct. " + msg;
        feedback.style.background = "#d4edda";
        score += 2.22; // 100 / 45 scenarios
    } else {
        feedback.innerText = "✗ Incorrect logic. Try to reconsider the technical manual.";
        feedback.style.background = "#f8d7da";
        score -= 1;
    }
    document.getElementById('score').innerText = Math.round(score);
    document.getElementById('next-btn').style.display = 'block';
}

document.getElementById('next-btn').onclick = () => {
    if (currentStep === 2) {
        currentStep = 3;
    } else {
        currentIdx++;
        currentStep = 1;
    }
    
    if (currentIdx < scenarios.length) {
        document.getElementById('progress').style.width = (currentIdx / scenarios.length * 100) + "%";
        loadStep();
    } else {
        document.getElementById('game-content').innerHTML = `<h3>Training Complete!</h3><p>Your Final Empathy Score: ${Math.round(score)}%</p>`;
    }
};

loadStep();
</script>
</body>
</html>
