<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSTTRAINGAME</title>
<style>
  :root {
    --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;
    --maroon:#8B1A1A;--maroon-light:#c0392b;--maroon-glow:rgba(139,26,26,0.18);
    --text:#f0f0f8;--muted:#8888aa;--border:rgba(255,255,255,0.07);
    --danger:#ff4d6d;--success:#00e5a0;--warning:#ffb347;
    --gold:#ffd700;--font:'Arial Narrow',Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);font-weight:bold;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(139,26,26,0.1) 0%,transparent 60%);pointer-events:none;z-index:0;}
  body.theme-light{--bg:#f4f2ef;--surface:#ffffff;--surface2:#f0ede8;--text:#1a1410;--muted:#8a7a6a;--border:rgba(0,0,0,0.1);}
  body.theme-light::before{background:none;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;border-bottom:1px solid var(--border);backdrop-filter:blur(20px);background:rgba(10,10,15,0.8);transition:background 0.3s;}
  body.theme-light nav{background:rgba(244,242,239,0.9);}
  .logo{font-family:var(--font);font-weight:bold;font-size:1.4rem;letter-spacing:0.04em;color:var(--text);text-decoration:none;text-transform:uppercase;}
  .logo span{color:var(--maroon-light);}
  .theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .theme-toggle:hover{border-color:var(--maroon-light);}
  .page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;padding:6rem 2.5rem 3rem;max-width:1200px;margin:0 auto;gap:4rem;}
  @media(max-width:900px){.page{flex-direction:column;padding:6rem 1.5rem 3rem;gap:2.5rem;}}
  .login-side{flex:1;min-width:300px;max-width:440px;}
  .site-tagline{font-size:clamp(2rem,4vw,3rem);font-weight:bold;text-transform:uppercase;letter-spacing:0.03em;line-height:1.1;margin-bottom:1.5rem;}
  .site-tagline span{color:var(--maroon-light);display:block;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-title{font-size:1rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--maroon-light);margin-bottom:1.5rem;}
  .form-group{margin-bottom:1.1rem;}
  label{display:block;font-size:0.72rem;font-weight:bold;color:var(--muted);margin-bottom:0.4rem;letter-spacing:0.1em;text-transform:uppercase;}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem;color:var(--text);font-family:var(--font);font-size:0.95rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
  input:focus{border-color:var(--maroon-light);box-shadow:0 0 0 3px var(--maroon-glow);}
  .btn-signin{width:100%;padding:0.85rem;background:var(--maroon);border:none;border-radius:8px;color:white;font-family:var(--font);font-size:0.95rem;font-weight:bold;cursor:pointer;transition:all 0.2s;letter-spacing:0.08em;text-transform:uppercase;margin-top:0.25rem;}
  .btn-signin:hover{background:var(--maroon-light);transform:translateY(-1px);box-shadow:0 6px 20px var(--maroon-glow);}
  .btn-signin:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .err-msg{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.25);border-radius:7px;padding:0.65rem 0.9rem;color:var(--danger);font-size:0.82rem;font-weight:normal;margin-bottom:1rem;display:none;}
  .err-msg.show{display:block;}
  .lb-side{flex:1;min-width:280px;}
  .lb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
  .lb-title{font-size:1.1rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--maroon-light);}
  .lb-subtitle{font-size:0.75rem;color:var(--muted);font-weight:normal;margin-top:0.15rem;}
  .lb-list{display:flex;flex-direction:column;gap:0.5rem;}
  .lb-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.85rem 1.1rem;display:flex;align-items:center;gap:0.85rem;transition:border-color 0.2s;}
  .lb-row:hover{border-color:rgba(139,26,26,0.3);}
  .lb-row.rank-1{border-color:rgba(255,215,0,0.35);background:rgba(255,215,0,0.04);}
  .lb-row.rank-2{border-color:rgba(192,192,192,0.25);}
  .lb-row.rank-3{border-color:rgba(205,127,50,0.25);}
  .lb-rank{font-size:1rem;min-width:28px;text-align:center;}
  .lb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--maroon),var(--maroon-light));display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:bold;color:white;flex-shrink:0;}
  .lb-name{flex:1;min-width:0;}
  .lb-name-text{font-size:0.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-name-sub{font-size:0.7rem;color:var(--muted);font-weight:normal;}
  .lb-pts{font-family:var(--font);font-weight:bold;font-size:1.1rem;color:var(--maroon-light);}
  .lb-pts-label{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;text-align:right;}
  .lb-bar-wrap{width:70px;flex-shrink:0;}
  .lb-bar-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
  .lb-bar-fill{height:100%;background:linear-gradient(90deg,var(--maroon),var(--maroon-light));border-radius:2px;transition:width 0.8s ease;}
  .lb-empty{text-align:center;padding:2rem;color:var(--muted);font-size:0.85rem;font-weight:normal;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
  .lb-reset-note{font-size:0.72rem;color:var(--muted);font-weight:normal;margin-top:0.75rem;text-align:center;}
  .signing-in{text-align:center;padding:1rem;color:var(--muted);font-size:0.85rem;font-weight:normal;}
</style>
</head>
<body>
<script src="theme.js"></script>
<nav>
  <a href="index.html" class="logo">BST<span>TRAINGAME</span></a>
  <button class="theme-toggle" id="themeToggle" onclick="TechTheme.toggle()">☀️</button>
</nav>

<div class="page">
  <div class="login-side">
    <div class="site-tagline">BST Technical<span>Training Challenge</span></div>
    <div class="login-card">
      <div class="login-title">Sign In</div>
      <div class="err-msg" id="errMsg"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="you@company.com" onkeydown="if(event.key==='Enter')handleLogin()">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleLogin()">
      </div>
      <button class="btn-signin" id="signinBtn" onclick="handleLogin()">Sign In →</button>
    </div>
  </div>

  <div class="lb-side">
    <div class="lb-header">
      <div>
        <div class="lb-title">🏆 Leaderboard</div>
        <div class="lb-subtitle">Monthly standings — resets at month end</div>
      </div>
    </div>
    <div class="lb-list" id="lbList">
      <div class="lb-empty">Loading leaderboard...</div>
    </div>
    <div class="lb-reset-note">Points earned for training, correct answers, and submitting feedback.</div>
  </div>
</div>

<script src="config.js"></script>
<script>
  function showErr(msg){const el=document.getElementById('errMsg');el.textContent=msg;el.classList.add('show');}
  function clearErr(){const el=document.getElementById('errMsg');el.textContent='';el.classList.remove('show');}

  async function handleLogin(){
    const email=document.getElementById('emailInput').value.trim();
    const password=document.getElementById('passwordInput').value;
    clearErr();
    if(!email||!password){showErr('Please enter your email and password.');return;}
    const btn=document.getElementById('signinBtn');
    btn.disabled=true;btn.textContent='Signing In...';
    try{
      // Step 1: authenticate with Supabase
      const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
        body:JSON.stringify({email:email,password:password})
      });
      const data=await res.json();
      if(!data.access_token){
        showErr(data.error_description||'Incorrect email or password.');
        btn.disabled=false;btn.textContent='Sign In →';
        return;
      }
      localStorage.setItem('tt_token',data.access_token);
      localStorage.setItem('tt_user',JSON.stringify(data.user));

      // Step 2: look up role in technician_notes
      const roleRes=await fetch(SUPABASE_URL+'/rest/v1/technician_notes?select=role&user_email=eq.'+encodeURIComponent(email),{
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
      });
      const roleData=await roleRes.json();
      const role=(Array.isArray(roleData)&&roleData.length&&roleData[0].role)?roleData[0].role:'user';
      localStorage.setItem('tt_role',role);

      if(role==='admin'){
        window.location.href='dashboard.html';
      } else {
        // For regular users, look up their daily token and redirect
        const tokenRes=await fetch(SUPABASE_URL+'/rest/v1/daily_tokens?select=token&user_email=eq.'+encodeURIComponent(email),{
          headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
        });
        const tokenData=await tokenRes.json();
        if(Array.isArray(tokenData)&&tokenData.length&&tokenData[0].token){
          window.location.href='daily.html?u='+tokenData[0].token;
        } else {
          window.location.href='training.html';
        }
      }
    }catch(e){
      showErr('Connection error. Please try again.');
      btn.disabled=false;btn.textContent='Sign In →';
    }
  }

  // Auto-redirect if already logged in
  try{
    const token=localStorage.getItem('tt_token');
    const role=localStorage.getItem('tt_role');
    if(token&&token!=='undefined'&&token!=='null'){
      if(role==='admin')window.location.href='dashboard.html';
      else if(role==='user')window.location.href='training.html';
    }
  }catch(e){localStorage.clear();}

  // Load leaderboard
  async function loadLeaderboard(){
    let entries=[];
    try{
      const res=await fetch(SUPABASE_URL+'/rest/v1/technician_points?select=user_email,points&limit=500',
        {headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
      const rows=await res.json();
      if(Array.isArray(rows)&&rows.length){
        const map={};
        rows.forEach(function(r){if(!map[r.user_email])map[r.user_email]=0;map[r.user_email]+=(r.points||0);});
        entries=Object.entries(map).map(function(e){return{email:e[0],pts:e[1]};}).sort(function(a,b){return b.pts-a.pts;});
      }
    }catch(e){}
    const lbEl=document.getElementById('lbList');
    if(!entries.length){lbEl.innerHTML='<div class="lb-empty">No points yet — be the first to train and top the board!</div>';return;}
    const maxPts=entries[0].pts||1;
    const medals=['🥇','🥈','🥉'];
    lbEl.innerHTML=entries.slice(0,10).map(function(e,i){
      const rankClass=i<3?'rank-'+(i+1):'';
      const medal=i<3?medals[i]:'<span style="font-family:var(--font);font-weight:bold;color:var(--muted);font-size:0.85rem;">'+(i+1)+'</span>';
      const barW=Math.round((e.pts/maxPts)*100);
      const name=e.email.split('@')[0];
      return '<div class="lb-row '+rankClass+'">'
        +'<div class="lb-rank">'+medal+'</div>'
        +'<div class="lb-avatar">'+name[0].toUpperCase()+'</div>'
        +'<div class="lb-name"><div class="lb-name-text">'+name+'</div><div class="lb-name-sub">'+e.email+'</div></div>'
        +'<div class="lb-bar-wrap"><div class="lb-bar-track"><div class="lb-bar-fill" style="width:'+barW+'%"></div></div></div>'
        +'<div><div class="lb-pts">'+e.pts+'</div><div class="lb-pts-label">pts</div></div>'
        +'</div>';
    }).join('');
  }
  loadLeaderboard();
</script>
</body>
</html>
