<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinMaster Training | Home</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .menu-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 6px; background: #0056b3; color: white; text-decoration: none; font-weight: bold; box-sizing: border-box; }
        .btn-alt { background: #2c3e50; }
        .btn-outline { background: white; color: #0056b3; border: 2px solid #0056b3; }
    </style>
</head>
<body>
    <div class="menu-card">
        <h2>BinMaster Academy</h2>
        <p>Technical Knowledge Portal</p>
        <a href="3Dtest.html" class="btn">Start 3D Training Engine</a>
        <a href="upload.html" class="btn btn-alt">+ Add Knowledge</a>
        <a href="dashboard.html" class="btn btn-outline">View Reports & Feedback</a>
    </div>
    <script>
        window.onload = () => {
            if (!localStorage.getItem('emp_name')) {
                let name = prompt("Enter technician name:");
                if (name) localStorage.setItem('emp_name', name);
            }
        };
    </script>
</body>
</html>
