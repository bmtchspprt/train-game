<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSTTRAINGAME</title>
<script src="config.js"></script>
<script>
  // Redirect to daily quiz if user has a token
  const user = JSON.parse(localStorage.getItem('tt_user') || '{}');
  const email = user.email;
  if(email){
    fetch(SUPABASE_URL+'/rest/v1/daily_tokens?select=token&user_email=eq.'+encodeURIComponent(email),{
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
    }).then(r=>r.json()).then(data=>{
      if(Array.isArray(data)&&data.length&&data[0].token){
        window.location.href='daily.html?u='+data[0].token;
      } else {
        window.location.href='index.html';
      }
    }).catch(()=>{window.location.href='index.html';});
  } else {
    window.location.href='index.html';
  }
</script>
</head>
<body></body>
</html>
