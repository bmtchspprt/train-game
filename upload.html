<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Intake</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f7f6; }
        .card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .drop-zone { border: 2px dashed #0056b3; height: 100px; display: flex; align-items: center; justify-content: center; color: #0056b3; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; margin-bottom: 15px; border: 1px solid #ccc; padding: 10px; }
        button { width: 100%; background: #0056b3; color: white; padding: 15px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add Technical Knowledge</h2>
        <div id="dz" class="drop-zone">Drag & Drop Text/Log File Here</div>
        <textarea id="txt" placeholder="Or paste manual text here..."></textarea>
        <button onclick="alert('Stored for AI scenario generation.')">Process Knowledge</button>
        <br><br>
        <a href="index.html">Back to Menu</a>
    </div>
    <script>
        const dz = document.getElementById('dz');
        const txt = document.getElementById('txt');
        dz.ondragover = (e) => { e.preventDefault(); dz.style.background = '#eef'; };
        dz.ondragleave = () => { dz.style.background = 'transparent'; };
        dz.ondrop = (e) => {
            e.preventDefault();
            dz.style.background = 'transparent';
            const reader = new FileReader();
            reader.onload = (ev) => txt.value = ev.target.result;
            reader.readAsText(e.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
