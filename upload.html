<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Upload | BinMaster</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f7f6; }
        .card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .drop-zone { border: 2px dashed #0056b3; height: 100px; display: flex; align-items: center; justify-content: center; color: #0056b3; margin-bottom: 20px; transition: 0.3s; text-align: center; }
        .drop-zone.over { background: #e1f0ff; border-style: solid; }
        textarea { width: 100%; height: 150px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
        button { width: 100%; background: #0056b3; color: white; padding: 15px; border: none; border-radius: 4px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Knowledge Intake</h2>
        <div id="drop-zone" class="drop-zone">Drag & Drop Text File Here</div>
        <textarea id="output" placeholder="Or paste text manually..."></textarea>
        <button onclick="alert('Data cached for processing.')">Save to Knowledge Base</button>
        <p><a href="index.html">Back to Main Menu</a></p>
    </div>

<script>
    const dz = document.getElementById('drop-zone');
    const out = document.getElementById('output');

    // Block default browser behavior for all drag/drop events
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eName => {
        dz.addEventListener(eName, e => {
            e.preventDefault();
            e.stopPropagation();
        });
    });

    dz.addEventListener('dragover', () => dz.classList.add('over'));
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));

    dz.addEventListener('drop', (e) => {
        dz.classList.remove('over');
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => { out.value = ev.target.result; };
            reader.readAsText(file);
        }
    });
</script>
</body>
</html>
