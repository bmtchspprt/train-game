<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — TechTrain</title>
<style>
  :root {
    --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;
    --maroon:#8B1A1A;--maroon-light:#c0392b;--maroon-glow:rgba(139,26,26,0.18);
    --text:#f0f0f8;--muted:#8888aa;--border:rgba(255,255,255,0.07);
    --danger:#ff4d6d;--success:#00e5a0;--font:'Arial Narrow',Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);font-weight:bold;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;transition:background 0.3s,color 0.3s;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(139,26,26,0.12) 0%,transparent 60%);pointer-events:none;z-index:0;}
  body.theme-light{--bg:#f4f2ef;--surface:#fff;--surface2:#f0ede8;--text:#1a1410;--muted:#8a7a6a;--border:rgba(0,0,0,0.1);}
  body.theme-light::before{background:none;}
  .top-bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:10;}
  body.theme-light .top-bar{background:rgba(244,242,239,0.9);}
  .logo{font-family:var(--font);font-weight:bold;font-size:1.3rem;color:var(--text);text-decoration:none;text-transform:uppercase;letter-spacing:0.04em;}
  .logo span{color:var(--maroon-light);}
  .theme-toggle{width:34px;height:34px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .theme-toggle:hover{border-color:var(--maroon-light);}
  .card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 40px 80px rgba(0,0,0,0.4);margin-top:4rem;}
  .card-title{font-family:var(--font);font-size:1.4rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.06em;color:var(--maroon-light);margin-bottom:0.3rem;text-shadow:0 0 20px var(--maroon-glow);}
  .card-sub{font-size:0.85rem;color:var(--muted);margin-bottom:2rem;font-weight:normal;}
  .form-group{margin-bottom:1.2rem;}
  label{display:block;font-size:0.75rem;font-weight:bold;color:var(--muted);margin-bottom:0.5rem;letter-spacing:0.08em;text-transform:uppercase;}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0.8rem 1rem;color:var(--text);font-family:var(--font);font-size:0.95rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
  input:focus{border-color:var(--maroon-light);box-shadow:0 0 0 3px var(--maroon-glow);}
  .btn-primary{width:100%;padding:0.9rem;background:var(--maroon);border:none;border-radius:10px;color:white;font-family:var(--font);font-size:1rem;font-weight:bold;cursor:pointer;margin-top:0.5rem;transition:all 0.2s;letter-spacing:0.08em;text-transform:uppercase;}
  .btn-primary:hover{background:var(--maroon-light);transform:translateY(-1px);box-shadow:0 8px 24px var(--maroon-glow);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .msg{padding:0.75rem 1rem;border-radius:8px;font-size:0.85rem;font-weight:normal;margin-bottom:1rem;display:none;}
  .msg.error{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.25);color:var(--danger);display:block;}
  .msg.success{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.25);color:var(--success);display:block;}
  .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--muted);font-size:0.8rem;font-weight:normal;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .btn-secondary{width:100%;padding:0.8rem;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:var(--font);font-size:0.88rem;font-weight:bold;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.04em;text-decoration:none;display:block;text-align:center;}
  .btn-secondary:hover{border-color:var(--maroon-light);color:var(--maroon-light);}
  .password-strength{margin-top:0.5rem;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;}
  .password-strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;}
  .strength-label{font-size:0.7rem;color:var(--muted);margin-top:0.3rem;font-weight:normal;}
  .requirements{margin-top:0.5rem;display:flex;flex-direction:column;gap:0.2rem;}
  .req{font-size:0.72rem;font-weight:normal;color:var(--muted);display:flex;align-items:center;gap:0.4rem;}
  .req.met{color:var(--success);}
  .req::before{content:'○';font-size:0.65rem;}
  .req.met::before{content:'✓';}
</style>
</head>
<body>
<script src="theme.js"></script>
<div class="top-bar">
  <a href="index.html" class="logo">TECH<span>TRAIN</span></a>
  <button class="theme-toggle" id="themeToggle" onclick="TechTheme.toggle()">☀️</button>
</div>

<div class="card">
  <div class="card-title">Create Account</div>
  <div class="card-sub">Sign up to start your training</div>

  <div class="msg" id="msg"></div>

  <div id="signupForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="you@company.com" oninput="clearMsg()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Create a password" oninput="checkPassword(this.value)">
      <div class="password-strength"><div class="password-strength-fill" id="strengthFill" style="width:0%"></div></div>
      <div class="strength-label" id="strengthLabel">Enter a password</div>
      <div class="requirements">
        <div class="req" id="req-length">At least 8 characters</div>
        <div class="req" id="req-upper">One uppercase letter</div>
        <div class="req" id="req-number">One number</div>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmInput" placeholder="Repeat your password" oninput="clearMsg()">
    </div>
    <button class="btn-primary" id="signupBtn" onclick="handleSignup()">Create Account →</button>
  </div>

  <div id="successPanel" style="display:none;text-align:center;padding:1rem 0;">
    <div style="font-size:2.5rem;margin-bottom:1rem;">✅</div>
    <div style="font-family:var(--font);font-size:1.1rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.06em;color:var(--success);margin-bottom:0.5rem;">Account Created!</div>
    <div style="font-size:0.85rem;color:var(--muted);font-weight:normal;line-height:1.6;margin-bottom:1.5rem;" id="successMsg"></div>
    <a href="index.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">Go to Sign In →</a>
  </div>

  <div class="divider">or</div>
  <a href="index.html" class="btn-secondary">← Back to Sign In</a>
</div>

<script src="config.js"></script>
<script>
  function clearMsg(){
    const m=document.getElementById('msg');
    m.className='msg';
    m.textContent='';
  }

  function showMsg(text,type){
    const m=document.getElementById('msg');
    m.textContent=text;
    m.className='msg '+type;
  }

  function checkPassword(val){
    const reqLength=document.getElementById('req-length');
    const reqUpper=document.getElementById('req-upper');
    const reqNumber=document.getElementById('req-number');
    const fill=document.getElementById('strengthFill');
    const label=document.getElementById('strengthLabel');

    const hasLength=val.length>=8;
    const hasUpper=/[A-Z]/.test(val);
    const hasNumber=/[0-9]/.test(val);

    reqLength.className='req'+(hasLength?' met':'');
    reqUpper.className='req'+(hasUpper?' met':'');
    reqNumber.className='req'+(hasNumber?' met':'');

    const score=(!val?0:(val.length<4?1:(hasLength&&hasUpper&&hasNumber?3:hasLength?2:1)));
    const configs=[
      {w:'0%',bg:'transparent',text:''},
      {w:'33%',bg:'#ff4d6d',text:'Weak'},
      {w:'66%',bg:'#ffb347',text:'Fair'},
      {w:'100%',bg:'#00e5a0',text:'Strong'}
    ];
    const c=configs[score];
    fill.style.width=c.w;
    fill.style.background=c.bg;
    label.textContent=c.text;
    label.style.color=c.bg||'var(--muted)';
  }

  async function handleSignup(){
    const email=document.getElementById('emailInput').value.trim();
    const password=document.getElementById('passwordInput').value;
    const confirm=document.getElementById('confirmInput').value;

    clearMsg();

    if(!email){showMsg('Please enter your email address.','error');return;}
    if(!password||password.length<8){showMsg('Password must be at least 8 characters.','error');return;}
    if(password!==confirm){showMsg('Passwords do not match.','error');return;}

    const btn=document.getElementById('signupBtn');
    btn.disabled=true;
    btn.textContent='Creating Account...';

    try{
      const res=await fetch(SUPABASE_URL+'/auth/v1/signup',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
        body:JSON.stringify({email:email,password:password})
      });
      const data=await res.json();

      if(data.id||data.user){
        // Success
        document.getElementById('signupForm').style.display='none';
        document.getElementById('successPanel').style.display='block';
        const needsConfirm=!data.session;
        document.getElementById('successMsg').textContent=needsConfirm
          ?'Check your email ('+email+') for a confirmation link before signing in.'
          :'Your account is ready. Sign in to start training!';
      } else {
        const errMsg=data.error_description||data.msg||data.message||'Sign up failed. This email may already be registered.';
        showMsg(errMsg,'error');
        btn.disabled=false;
        btn.textContent='Create Account →';
      }
    }catch(e){
      showMsg('Connection error. Please try again.','error');
      btn.disabled=false;
      btn.textContent='Create Account →';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){handleSignup();}
  });
</script>
</body>
</html>
