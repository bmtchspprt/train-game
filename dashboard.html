<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — TechTrain</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#070710;--surface:#0f0f1c;--surface2:#161627;--surface3:#1d1d32;
    --accent:#00e5a0;--accent2:#7b5cfa;--accent3:#38b6ff;
    --maroon:#8B1A1A;--maroon-light:#c0392b;--maroon-glow:rgba(139,26,26,0.18);
    --text:#eeeef8;--muted:#606080;--border:rgba(255,255,255,0.06);
    --danger:#ff4d6d;--warning:#ffb347;--success:#00e5a0;
    --headline-font:'Arial Narrow',Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background 0.3s,color 0.3s;}
  body.theme-light{--bg:#f4f2ef;--surface:#fff;--surface2:#f0ede8;--surface3:#e8e4de;--text:#1a1410;--muted:#8a7a6a;--border:rgba(0,0,0,0.08);}
  .app-layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-logo{padding:1.5rem 1.4rem;font-family:var(--headline-font);font-weight:bold;font-size:1.3rem;color:var(--text);text-decoration:none;letter-spacing:0.04em;text-transform:uppercase;border-bottom:1px solid var(--border);display:block;}
  .sidebar-logo span{color:var(--maroon-light);}
  .sidebar-section{padding:1.2rem 1.2rem 0.5rem;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--headline-font);}
  .sidebar-nav{list-style:none;padding:0 0.8rem;}
  .sidebar-nav li a,.sidebar-nav li button{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0.8rem;border-radius:8px;color:var(--muted);text-decoration:none;font-size:0.88rem;font-weight:400;transition:all 0.15s;background:none;border:none;width:100%;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .sidebar-nav li a:hover,.sidebar-nav li button:hover{background:var(--surface2);color:var(--text);}
  .sidebar-nav li a.active,.sidebar-nav li button.active{background:var(--maroon-glow);color:var(--maroon-light);}
  .badge{margin-left:auto;background:var(--danger);color:white;border-radius:100px;padding:0.1rem 0.5rem;font-size:0.68rem;font-weight:700;min-width:20px;text-align:center;}
  .sidebar-bottom{margin-top:auto;padding:1rem;border-top:1px solid var(--border);}
  .admin-chip{display:flex;align-items:center;gap:0.6rem;font-size:0.82rem;color:var(--muted);}
  .admin-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--maroon),var(--maroon-light));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;color:white;flex-shrink:0;}
  .btn-logout{width:100%;margin-top:0.7rem;padding:0.5rem;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.82rem;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
  .btn-logout:hover{border-color:var(--danger);color:var(--danger);}
  .main-content{flex:1;overflow-y:auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.5rem;border-bottom:1px solid var(--border);background:rgba(7,7,16,0.8);backdrop-filter:blur(16px);position:sticky;top:0;z-index:50;transition:background 0.3s;}
  body.theme-light .topbar{background:rgba(244,242,239,0.9);}
  .topbar-title{font-family:var(--headline-font);font-size:1.3rem;font-weight:bold;letter-spacing:0.04em;text-transform:uppercase;color:var(--maroon-light);}
  .topbar-sub{font-size:0.78rem;color:var(--muted);margin-top:0.1rem;}
  .topbar-right{display:flex;gap:0.75rem;align-items:center;}
  .theme-toggle{width:34px;height:34px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .theme-toggle:hover{border-color:var(--maroon-light);}
  .btn-topbar{padding:0.5rem 1.1rem;border-radius:8px;font-size:0.82rem;cursor:pointer;transition:all 0.2s;text-decoration:none;font-family:var(--headline-font);font-weight:bold;text-transform:uppercase;letter-spacing:0.04em;}
  .btn-topbar.ghost{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-topbar.ghost:hover{border-color:var(--maroon-light);color:var(--maroon-light);}
  .btn-topbar.primary{background:var(--maroon);border:1px solid var(--maroon-light);color:white;}
  .btn-topbar.primary:hover{background:var(--maroon-light);}
  .section{padding:2rem 2.5rem;display:none;}
  .section.active{display:block;}
  .sec-label{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--maroon-light);font-weight:bold;margin-bottom:0.75rem;font-family:var(--headline-font);}
  .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2.5rem;}
  .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;transition:border-color 0.2s;}
  .metric-card:hover{border-color:rgba(139,26,26,0.3);}
  .metric-icon{font-size:1.4rem;margin-bottom:0.8rem;}
  .metric-val{font-family:var(--headline-font);font-size:2rem;font-weight:bold;letter-spacing:0.02em;margin-bottom:0.2rem;color:var(--maroon-light);}
  .metric-label{font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-family:var(--headline-font);font-weight:bold;}
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2.5rem;}
  @media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;}
  .chart-title{font-family:var(--headline-font);font-size:1rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.04em;color:var(--maroon-light);margin-bottom:0.3rem;}
  .chart-sub{font-size:0.78rem;color:var(--muted);margin-bottom:1.2rem;}
