<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supervisor Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>
    <h2>Training Dashboard</h2>
    <div class="card">
        <h3>Technician Results</h3>
        <table>
            <thead><tr><th>Tech</th><th>Outcome</th><th>Strikes</th></tr></thead>
            <tbody id="res-data"></tbody>
        </table>
    </div>
    <div class="card">
        <h3>Field Corrections</h3>
        <table>
            <thead><tr><th>Tech</th><th>Correction</th></tr></thead>
            <tbody id="feed-data"></tbody>
        </table>
    </div>
    <a href="index.html">Back to Menu</a>

    <script>
        const SB_URL = 'YOUR_SUPABASE_URL_HERE';
        const SB_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function load() {
            const { data: r } = await _supabase.from('bst_training_results').select('*');
            const { data: f } = await _supabase.from('bst_field_feedback').select('*');

            document.getElementById('res-data').innerHTML = r.map(x => `<tr><td>${x.technician_name}</td><td>${x.outcome}</td><td>${x.strikes}</td></tr>`).join('');
            document.getElementById('feed-data').innerHTML = f.map(x => `<tr><td>${x.author_name}</td><td>${x.suggested_correction}</td></tr>`).join('');
        }
        load();
    </script>
</body>
</html>
