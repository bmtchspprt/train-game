<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports | BinMaster</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>
    <h1>System Reports</h1>
    <div class="card">
        <h3>Training Activity</h3>
        <table>
            <thead><tr><th>Tech</th><th>Strikes</th><th>Outcome</th></tr></thead>
            <tbody id="t-body"></tbody>
        </table>
    </div>
    <div class="card">
        <h3>Field Feedback</h3>
        <table>
            <thead><tr><th>Tech</th><th>Comment</th></tr></thead>
            <tbody id="f-body"></tbody>
        </table>
    </div>
    <a href="index.html">Back to Menu</a>

<script>
    const SB_URL = 'YOUR_SUPABASE_URL';
    const SB_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function load() {
        const { data: res } = await _supabase.from('bst_training_results').select('*');
        const { data: feed } = await _supabase.from('bst_field_feedback').select('*');

        if(res) document.getElementById('t-body').innerHTML = res.map(r => `<tr><td>${r.technician_name}</td><td>${r.strikes}</td><td>${r.outcome}</td></tr>`).join('');
        if(feed) document.getElementById('f-body').innerHTML = feed.map(f => `<tr><td>${f.author_name}</td><td>${f.suggested_correction}</td></tr>`).join('');
    }
    load();
</script>
</body>
</html>
